<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>日常请假列表</title>
  <style>
    :root{
      --bg:#f2f4f5;
      --card:#fff;
      --text:#1f1f1f;
      --sub:#8f8f8f;
      --cyan:#55d8d2;
      --purple:#bb79f3;
      --red:#ef2a2a;
      --orange:#f6a032;
      --footer1:#52d8d0;
      --footer2:#46aef6;
      --mask:rgba(0,0,0,.38);
      --line:#efefef;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body{
      margin:0; padding:0; min-height:100vh;
      background:var(--bg); color:var(--text);
      font-family:"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",sans-serif;
    }
    .app{
      width:100%; max-width:480px; margin:0 auto; min-height:100vh;
      background:var(--bg); position:relative; padding-bottom:92px;
    }
    .top-space{
      height:0;
      position:sticky;
      top:0;
      z-index:10;
      background:var(--bg);
    }

    .secret-hit{
      position:fixed;
      top:0;
      left:50%;
      transform:translateX(-50%);
      width:140px;
      height:42px;
      z-index:120;
      background:transparent;
    }

    .list{ padding-top:0; }
    .card{
      background:#fff;
      margin-bottom:10px;
      position:relative;
      overflow:hidden;
    }
    .card-inner{ padding:20px 18px 10px; }
    .row{
      display:flex;
      align-items:flex-start;
      margin-bottom:20px;
    }
    .row:last-child{ margin-bottom:10px; }
    .label{
      width:88px;
      flex-shrink:0;
      color:#444;
      font-size:16px;
      line-height:26px;
    }
    .value-wrap{
      flex:1;
      min-width:0;
      display:flex;
      align-items:flex-start;
    }
    .value{
      flex:1;
      min-width:0;
      color:#666;
      font-size:16px;
      line-height:26px;
      word-break:break-all;
      white-space:normal;
      padding-right:2px;
      transition:opacity .15s;
    }
    .editable{ cursor:pointer; }
    .editable:active{ opacity:.72; }
    .detail{
      color:var(--cyan);
      font-size:14px;
      line-height:26px;
      white-space:nowrap;
      margin-left:10px;
      cursor:pointer;
      user-select:none;
    }
    .corner-tag{
      position:absolute;
      right:-44px;
      bottom:12px;
      width:152px;
      height:30px;
      line-height:30px;
      transform:rotate(-45deg);
      text-align:center;
      color:#fff;
      font-size:14px;
      z-index:3;
      box-shadow:0 1px 2px rgba(0,0,0,.08);
      user-select:none;
    }
    .corner-finished{ background:var(--purple); }
    .corner-reject{ background:var(--red); }
    .corner-pending{ background:var(--orange); }

    .bottom-tip{
      text-align:center;
      color:#222;
      font-size:16px;
      padding:24px 0 14px;
    }
    .submit-btn{
      position:fixed;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:100%;
      max-width:480px;
      height:56px;
      border:none;
      color:#fff;
      font-size:18px;
      background:linear-gradient(90deg,var(--footer1),var(--footer2));
      z-index:40;
    }
    .safe-bottom{
      height:env(safe-area-inset-bottom);
      background:linear-gradient(90deg,var(--footer1),var(--footer2));
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:90px;
      transform:translateX(-50%);
      background:rgba(0,0,0,.76);
      color:#fff;
      font-size:13px;
      padding:9px 14px;
      border-radius:18px;
      z-index:199;
      display:none;
      white-space:nowrap;
    }

    .mask{
      position:fixed;
      inset:0;
      background:var(--mask);
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index:180;
    }
    .sheet{
      width:100%;
      max-width:480px;
      background:#fff;
      border-radius:16px 16px 0 0;
      padding:14px 14px calc(16px + env(safe-area-inset-bottom));
      max-height:88vh;
      overflow:auto;
    }
    .sheet-title{
      text-align:center;
      font-size:16px;
      font-weight:600;
      color:#222;
      margin-bottom:14px;
    }
    .form-item{ margin-bottom:12px; }
    .form-item label{
      display:block;
      margin-bottom:6px;
      font-size:13px;
      color:#666;
    }
    .form-item input,
    .form-item select,
    .form-item textarea{
      width:100%;
      border:1px solid #e5e5e5;
      border-radius:10px;
      padding:11px 12px;
      font-size:15px;
      color:#222;
      background:#fff;
      outline:none;
    }
    .form-item textarea{
      min-height:100px;
      resize:vertical;
    }
    .sheet-row{
      display:flex;
      gap:10px;
      margin-top:14px;
    }
    .sheet-btn{
      flex:1;
      border:none;
      border-radius:10px;
      font-size:15px;
      padding:12px 0;
      cursor:pointer;
    }
    .btn-cancel{ background:#f2f2f2; color:#333; }
    .btn-ok{ background:#31cfd7; color:#fff; }
    .btn-danger{ background:#f24a4a; color:#fff; }
    .mini-tip{
      margin-top:4px;
      color:#999;
      font-size:12px;
      line-height:1.5;
    }

    .detail-page{
      position:fixed;
      inset:0;
      background:#f5f5f6;
      z-index:150;
      display:none;
      overflow:auto;
      touch-action:pan-y;
    }
    .detail-page-inner{
      width:100%;
      max-width:480px;
      margin:0 auto;
      min-height:100vh;
      background:#f5f5f6;
      padding-bottom:20px;
      padding-top:0;
    }
    .section-title{
      background:#ececef;
      color:#4b4b4b;
      font-size:15px;
      padding:16px 16px;
      margin-top:0;
    }
    .detail-card{
      background:#fff;
    }
    .detail-row{
      display:flex;
      align-items:flex-start;
      min-height:58px;
      border-bottom:1px solid var(--line);
      padding:0 14px;
      background:#fff;
    }
    .detail-row:last-child{
      border-bottom:none;
    }
    .detail-label{
      width:42%;
      min-width:120px;
      padding:18px 0;
      font-size:16px;
      color:#333;
      line-height:22px;
      display:flex;
      align-items:center;
      gap:4px;
    }
    .required{
      color:#d92b2b;
      font-size:18px;
      line-height:1;
      margin-right:4px;
    }
    .detail-value{
      flex:1;
      padding:18px 0;
      font-size:16px;
      color:#8a8a8a;
      line-height:22px;
      word-break:break-all;
      white-space:pre-wrap;
      text-align:left;
    }
    .detail-value.editable{
      cursor:pointer;
    }
    .radio-group{
      display:flex;
      align-items:center;
      gap:30px;
      color:#7d7d7d;
      font-size:16px;
      flex-wrap:wrap;
    }
    .radio-item{
      display:flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
      user-select:none;
    }
    .radio-dot{
      width:22px;
      height:22px;
      border:2px solid #d9d9d9;
      border-radius:50%;
      position:relative;
      background:#fff;
      flex-shrink:0;
    }
    .radio-dot.active::after{
      content:"";
      position:absolute;
      inset:4px;
      background:#bfbfbf;
      border-radius:50%;
    }

    /* 蓝色“请假条”入口 */
    .ticket-entry-wrap{
      position:relative;
      z-index:2;
      display:flex;
      justify-content:center;
      padding:0 0 14px;
    }
    .ticket-entry{
      width:35%;
      height:38px;
      min-height:0;
      padding:0 6px;
      border:0;
      border-radius:5px;
      color:#fff;
      font-size:15px;
      letter-spacing:1px;
      background:linear-gradient(100deg,#45c9ed,#42b5e9);
      box-shadow:0 2px 5px rgba(52,174,218,.2);
      cursor:pointer;
    }
    .ticket-entry:active{
      opacity:.82;
      transform:scale(.98);
    }

    /* 请假条详情页顶部倒计时 */
    .countdown-bar{
      display:none;
      align-items:center;
      justify-content:center;
      gap:12px;
      min-height:82px;
      padding:16px;
      background:#fff;
      color:#111;
      font-size:22px;
    }
    .countdown-icon{
      color:#e64b52;
      font-size:28px;
      line-height:1;
    }
    .countdown-number{
      min-width:28px;
      color:#111;
      font-variant-numeric:tabular-nums;
    }

    /* 审批中：卡片结构 */
    .card.has-flow{ background:transparent; }
    .card.has-flow .card-inner{
      background:#fff;
      position:relative;
      overflow:hidden;
    }

    /* 审批流 */
    .approve-flow{
      background:#f2f6f9;
      padding:12px 0 0;
    }
    .flow-item{
      position:relative;
      padding-left:64px;
      padding-right:16px;
    }
    .flow-item + .flow-item{ margin-top:11px; }
    .flow-card{
      background:#fff;
      border-radius:6px;
      padding:20px 18px 24px;
    }
    .flow-dot{
      position:absolute;
      left:41px;
      top:25px;
      width:11px;
      height:11px;
      border-radius:50%;
      background:#2fd2cd;
      box-sizing:border-box;
      z-index:2;
    }
    .flow-dot.waiting{
      left:40px;
      top:24px;
      width:13px;
      height:13px;
      background:#fff;
      border:2px solid #7ce4e2;
    }

    /* 已拒绝：节点之间的灰色竖线 */
    .approve-flow.flow-lined{ position:relative; }
    .flow-lined .flow-item::after{
      content:"";
      position:absolute;
      left:46px;
      top:30px;
      bottom:-11px;
      width:1px;
      background:#cfd3d6;
      z-index:1;
    }
    .flow-lined .flow-item:last-child::after{ display:none; }
    .flow-lined .flow-item:first-child::before{
      content:"";
      position:absolute;
      left:46px;
      top:-12px;
      height:12px;
      width:1px;
      background:#cfd3d6;
      z-index:1;
    }
    .flow-head{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:10px;
    }
    .flow-name{
      font-size:16px;
      font-weight:600;
      color:#1a1a1a;
      line-height:22px;
    }
    .flow-date{
      font-size:14px;
      color:#666;
      line-height:22px;
      white-space:nowrap;
    }
    .flow-body{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
      margin-top:24px;
    }
    .flow-opinion{
      font-size:14px;
      color:#7d7d7d;
      line-height:20px;
      word-break:break-all;
    }
    .flow-status{
      font-size:16px;
      font-weight:600;
      line-height:20px;
      white-space:nowrap;
    }
    .st-pass{ color:#2fd2cd; }
    .st-wait{ color:#fa7a5c; }
    .st-reject{ color:#d0201e; }

    .corner-approving{ background:#ee947c; }
    .corner-reject{ background:#dc2024; }

    /* 顶部状态提示条：有已请假/审批中/待销假记录时显示 */
    .state-banner{
      display:none;
      align-items:center;
      justify-content:center;
      gap:9px;
      padding:10px 12px;
      background:var(--bg);
      color:#a83661;
      font-size:14px;
      line-height:20px;
      letter-spacing:0;
    }
    .state-banner.show{ display:flex; }
    .state-banner-icon{
      width:18px;
      height:18px;
      flex-shrink:0;
      fill:#d81b60;
      display:block;
    }

    @media (max-width:390px){
      .label{ width:82px; font-size:15px; }
      .value{ font-size:15px; }
      .detail{ font-size:13px; }
      .detail-label{ min-width:106px; font-size:15px; }
      .detail-value{ font-size:15px; }
      .flow-name{ font-size:15px; }
      .flow-status{ font-size:15px; }
    }
  </style>
</head>
<body>
  <div class="app" id="mainPage">
    <div class="top-space"></div>
    <div class="secret-hit" id="secretHit"></div>
    <div class="state-banner" id="stateBanner">
      <svg class="state-banner-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5S10.5 3.17 10.5 4v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
      </svg>
      <span>当前状态不能请假或有请假未完成!</span>
    </div>
    <div class="list" id="list"></div>
    <div class="bottom-tip">已经到底了哦</div>
    <button class="submit-btn" onclick="openAddSheet()">提交请假</button>
    <div class="safe-bottom"></div>
  </div>

  <div class="detail-page" id="detailPage">
    <div class="detail-page-inner">
      <div class="countdown-bar" id="ticketCountdown">
        <span class="countdown-icon">◷</span>
        <span>倒计时：</span>
        <span class="countdown-number"><span id="ticketSeconds">60</span>秒</span>
      </div>

      <div class="section-title">请假信息</div>
      <div class="detail-card" id="detailInfoBox"></div>

      <div class="section-title" style="margin-top:12px;">外出信息</div>
      <div class="detail-card" id="detailOutBox"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="mask" id="passwordMask">
    <div class="sheet">
      <div class="sheet-title">身份验证</div>
      <div class="form-item">
        <label>请输入密码</label>
        <input id="passwordInput" type="password" placeholder="请输入密码">
      </div>
      <div class="sheet-row">
        <button class="sheet-btn btn-cancel" onclick="closePasswordSheet()">取消</button>
        <button class="sheet-btn btn-ok" onclick="submitPassword()">确认</button>
      </div>
    </div>
  </div>

  <div class="mask" id="fieldMask">
    <div class="sheet">
      <div class="sheet-title" id="fieldTitle">编辑字段</div>

      <div class="form-item" id="fieldInputWrap">
        <label id="fieldLabel">内容</label>
        <input id="fieldInput" placeholder="请输入内容">
      </div>

      <div class="form-item" id="fieldSelectWrap" style="display:none;">
        <label id="fieldSelectLabel">选择内容</label>
        <select id="fieldSelect"></select>
      </div>

      <div id="fieldTimeBox" style="display:none;">
        <div class="form-item">
          <label id="fieldStartTimeLabel">开始时间</label>
          <input id="fieldStartTime" type="datetime-local">
        </div>
        <div class="form-item">
          <label id="fieldEndTimeLabel">结束时间</label>
          <input id="fieldEndTime" type="datetime-local">
        </div>
        <div class="form-item">
          <label id="fieldDurationLabel">时长</label>
          <input id="fieldDurationPreview" readonly>
        </div>
      </div>

      <div class="mini-tip" id="fieldTip"></div>

      <div class="sheet-row">
        <button class="sheet-btn btn-cancel" onclick="closeFieldSheet()">取消</button>
        <button class="sheet-btn btn-ok" onclick="saveFieldSheet()">保存</button>
        <button class="sheet-btn btn-danger" id="deleteBtn" onclick="deleteCurrentCard()">删除</button>
      </div>
    </div>
  </div>

  <div class="mask" id="addMask">
    <div class="sheet">
      <div class="sheet-title">新增请假</div>

      <div class="form-item">
        <label>学号</label>
        <input id="aStudentId" placeholder="请输入学号">
      </div>

      <div class="form-item">
        <label>姓名</label>
        <input id="aStudentName" placeholder="请输入姓名">
      </div>

      <div class="form-item">
        <label>请假开始时间</label>
        <input id="aStartTime" type="datetime-local">
      </div>

      <div class="form-item">
        <label>请假结束时间</label>
        <input id="aEndTime" type="datetime-local">
      </div>

      <div class="form-item">
        <label>请假时长（自动计算）</label>
        <input id="aDuration" placeholder="选择开始和结束时间后自动生成" readonly>
      </div>

      <div class="form-item">
        <label>是否续假</label>
        <select id="aRenew">
          <option value="否">否</option>
          <option value="是">是</option>
        </select>
      </div>

      <div class="form-item">
        <label>请假原因</label>
        <input id="aReason" placeholder="例如：校外:实习实践">
      </div>

      <div class="form-item">
        <label>销假状态</label>
        <select id="aCancelStatus">
          <option value=""></option>
          <option value="已销假">已销假</option>
          <option value="待销假">待销假</option>
          <option value="未销假">未销假</option>
        </select>
      </div>

      <div class="form-item">
        <label>右下角状态条</label>
        <select id="aTagType">
          <option value="">无</option>
          <option value="finished">已销假（紫色）</option>
          <option value="pending">待销假（橙色）</option>
          <option value="approving">审批中（橙色·带审批流）</option>
          <option value="reject">已拒绝（红色）</option>
        </select>
      </div>

      <div class="sheet-row">
        <button class="sheet-btn btn-cancel" onclick="closeAddSheet()">取消</button>
        <button class="sheet-btn btn-danger" onclick="clearAddForm()">删除新增内容</button>
        <button class="sheet-btn btn-ok" onclick="saveAddSheet()">保存</button>
      </div>
    </div>
  </div>

    function normalizeReasonText(str){
      return String(str || "").replace(/·/g, ":");
    }

    function ensureDetailFields(item){
      item.term = item.term || "2025-2026学年第二学期";
      item.leaveType = item.leaveType || "校外";
      item.leaveReason = item.leaveReason || "事假";
      item.detailDesc = item.detailDesc || "";
      item.mobilePhone = item.mobilePhone || "";
      item.guardianName = item.guardianName || "";
      item.guardianPhone = item.guardianPhone || "";
      item.informedGuardian = item.informedGuardian || "是";
      item.isLeaveSchool = item.isLeaveSchool || "是";
      item.isLeaveDorm = item.isLeaveDorm || "是";
      item.outPlace = item.outPlace || "";
      item.outDetailPlace = item.outDetailPlace || "";
      item.outStartTime = item.outStartTime || item.startTime || "";
      item.outEndTime = item.outEndTime || item.endTime || "";
      item.outWayGo = item.outWayGo || "打车";
      item.outWayBack = item.outWayBack || "打车";
      item.withCompanion = item.withCompanion || "是";
      return item;
    }

    function getData(){
      const raw = localStorage.getItem(STORAGE_KEY);
      let data = [];
      if(!raw){
        data = defaultData.map(x => ensureDetailFields({...x, reason: normalizeReasonText(x.reason)}));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return data;
      }
      try{
        data = JSON.parse(raw) || [];
      }catch(e){
        data = defaultData.map(x => ensureDetailFields({...x, reason: normalizeReasonText(x.reason)}));
      }
      data = data.map(item => ensureDetailFields({
        ...item,
        reason: normalizeReasonText(item.reason)
      }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return data;
    }

    function setData(data){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data.map(ensureDetailFields)));
    }

    function isUnlocked(){
      return unlocked === true;
    }

    function setUnlocked(v){
      unlocked = !!v;
    }

    function showToast(msg){
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.style.display = "block";
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toast.style.display = "none";
      }, 1600);
    }

    function escapeHtml(str){
      return String(str || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
    }

    function tagText(type){
      if(type === "finished") return "已销假";
      if(type === "pending") return "待销假";
      if(type === "approving") return "审批中";
      if(type === "reject") return "已拒绝";
      return "";
    }

    function tagClass(type){
      if(type === "finished") return "corner-finished";
      if(type === "pending") return "corner-pending";
      if(type === "approving") return "corner-approving";
      if(type === "reject") return "corner-reject";
      return "";
    }

    /* 仅“待销假”状态显示请假条入口 */
    function isPendingCancel(item){
      if(!item) return false;
      const status = String(item.cancelStatus || "").trim();
      if(status) return status === "待销假";
      return item.tagType === "pending";
    }

    /* 审批流：日期推算 */
    function shiftDay(dateStr, days){
      const d = new Date(String(dateStr || "").replace(/-/g, "/"));
      if(isNaN(d.getTime())) return "";
      d.setDate(d.getDate() + days);
      const pad = n => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    }

    function flowNodeHTML(node){
      const dotClass = node.waiting ? "flow-dot waiting" : "flow-dot";
      const body = node.note
        ? `<span class="flow-opinion">${escapeHtml(node.note)}</span>`
        : `<span class="flow-opinion">意见：${escapeHtml(node.opinion || "")}</span>
           <span class="flow-status ${node.statusClass}">${escapeHtml(node.statusText)}</span>`;

      return `
        <div class="flow-item">
          <span class="${dotClass}"></span>
          <div class="flow-card">
            <div class="flow-head">
              <span class="flow-name">${escapeHtml(node.name)}</span>
              <span class="flow-date">${escapeHtml(node.date || "")}</span>
            </div>
            <div class="flow-body">${body}</div>
          </div>
        </div>`;
    }

    /* “审批中”/“已拒绝”状态的审批流 */
    function buildApprovalFlow(item){
      if(!item) return "";

      const base = String(item.startTime || "").slice(0, 10);

      /* 学生申请：发起节点 */
      const applyNode = {
        name: "学生申请",
        date: shiftDay(base, -4),
        note: (item.studentName || "") + "(" + (item.studentId || "") + ")发起申请"
      };

      if(item.tagType === "reject"){
        const nodes = [
          {
            name: "学管干部",
            date: shiftDay(base, -3),
            opinion: "同意",
            statusText: "已拒绝",
            statusClass: "st-reject"
          },
          applyNode
        ];
        return `<div class="approve-flow flow-lined">${nodes.map(flowNodeHTML).join("")}</div>`;
      }

      if(item.tagType === "approving"){
        const nodes = [
          {
            name: "分管校领导",
            waiting: true,
            date: "",
            opinion: "",
            statusText: "待审批",
            statusClass: "st-wait"
          },
          {
            name: "学院",
            date: shiftDay(base, -1),
            opinion: "同意",
            statusText: "已通过",
            statusClass: "st-pass"
          },
          {
            name: "大队长",
            date: shiftDay(base, -2),
            opinion: "同意",
            statusText: "已通过",
            statusClass: "st-pass"
          },
          {
            name: "学管干部",
            date: shiftDay(base, -3),
            opinion: "同意",
            statusText: "已通过",
            statusClass: "st-pass"
          },
          applyNode
        ];
        return `<div class="approve-flow flow-lined">${nodes.map(flowNodeHTML).join("")}</div>`;
      }

      return "";
    }

    function toDatetimeLocal(str){
      return str ? str.replace(" ", "T") : "";
    }

    function fromDatetimeLocal(str){
      return str ? str.replace("T", " ") : "";
    }

    function parseDateTime(str){
      if(!str) return null;
      return new Date(str.replace(/-/g, "/"));
    }

    function calcDurationText2(startStr, endStr){
      const s = parseDateTime(startStr);
      const e = parseDateTime(endStr);
      if(!s || !e || isNaN(s.getTime()) || isNaN(e.getTime()) || e < s) return "";
      const diff = e.getTime() - s.getTime();
      const totalHours = Math.floor(diff / (1000 * 60 * 60));
      const days = Math.floor(totalHours / 24);
      const hours = totalHours % 24;
      return days > 0 ? `${days}天${hours}小时` : `${hours}小时`;
    }

    function setWechatTitle(title){
      document.title = title;
      const iframe = document.createElement("iframe");
      iframe.style.display = "none";
      iframe.src = "about:blank";
      iframe.onload = function(){
        setTimeout(() => {
          iframe.remove();
        }, 0);
      };
      document.body.appendChild(iframe);
    }

    function updateStateBanner(data){
      const bar = document.getElementById("stateBanner");
      if(!bar) return;

      const blocked = Array.isArray(data) && data.some(item => {
        const t = item && item.tagType;
        return t === "finished" || t === "approving" || t === "pending";
      });

      bar.classList.toggle("show", blocked);
    }

        const ticketHtml = isPendingCancel(item)
          ? `<div class="ticket-entry-wrap">

                onclick="openDetailPage(${item.id}, true)">

        return `

            </div>

              <div class="label">请假时间</div>
              <div class="value-wrap">
                <div class="value ${canEdit ? 'editable' : ''}" onclick="openFieldEditor(${item.id}, 'timeRange', '请假时间', 'list')">${escapeHtml(item.startTime + "至" + item.endTime)}</div>
              </div>
            </div>

            <div class="row">
              <div class="label">请假时长</div>
              <div class="value-wrap">
                <div class="value">${escapeHtml(item.duration)}</div>
              </div>
            </div>

            <div class="row">
              <div class="label">是否续假</div>
              <div class="value-wrap">
                <div class="value ${canEdit ? 'editable' : ''}" onclick="openFieldEditor(${item.id}, 'isRenew', '是否续假', 'list')">${escapeHtml(item.isRenew)}</div>
              </div>

              </div>
            </div>

            <div class="row">

              <div class="value-wrap">
                <div class="value ${canEdit ? 'editable' : ''}" onclick="openFieldEditor(${item.id}, 'cancelStatus', '销假状态', 'list')">${escapeHtml(item.cancelStatus)}</div>

            </div>
            ${hasFlow ? tagHtml : ""}
          </div>

          ${hasFlow ? buildApprovalFlow(item) : ""}
          ${hasFlow ? "" : ticketHtml}
          ${hasFlow ? "" : tagHtml}

    function requireUnlock(){
      if(!isUnlocked()){
        return false;
      }
      return true;
    }

    }

    function openFieldEditor(id, key, title, source="list"){
      if(!requireUnlock()) return;

      currentField = { id, key, title, source };
      document.getElementById("fieldTitle").innerText = "编辑" + title;
      document.getElementById("fieldLabel").innerText = title;
      document.getElementById("fieldSelectLabel").innerText = title;
      document.getElementById("fieldTip").innerText = "";

      document.getElementById("fieldSelectWrap").style.display = "none";
      document.getElementById("fieldTimeBox").style.display = "none";
      document.getElementById("deleteBtn").style.display = source === "list" ? "block" : "none";

      const item = getData().find(x => x.id === id);
      if(!item) return;

      if(key === "isRenew" || key === "informedGuardian" || key === "isLeaveSchool" || key === "isLeaveDorm" || key === "withCompanion"){
        document.getElementById("fieldInputWrap").style.display = "none";
        document.getElementById("fieldSelectWrap").style.display = "block";
        document.getElementById("fieldSelect").innerHTML = `
          <option value="是">是</option>
          <option value="否">否</option>
        `;

        document.getElementById("fieldInputWrap").style.display = "none";
        document.getElementById("fieldSelectWrap").style.display = "block";
        document.getElementById("fieldSelect").innerHTML = `
          <option value=""></option>
          <option value="已销假">已销假</option>
          <option value="待销假">待销假</option>
          <option value="未销假">未销假</option>
        `;
        document.getElementById("fieldSelect").value = item.cancelStatus || "";
      } else if(key === "leaveType"){
        document.getElementById("fieldInputWrap").style.display = "none";
        document.getElementById("fieldSelectWrap").style.display = "block";
        document.getElementById("fieldSelect").innerHTML = `
          <option value="校外">校外</option>
          <option value="校内">校内</option>
        `;
        document.getElementById("fieldSelect").value = item.leaveType || "校外";
      } else if(key === "leaveReason"){
        document.getElementById("fieldInputWrap").style.display = "none";
        document.getElementById("fieldSelectWrap").style.display = "block";
        document.getElementById("fieldSelect").innerHTML = `
          <option value="事假">事假</option>
          <option value="病假">病假</option>
          <option value="其他">其他</option>
        `;
        document.getElementById("fieldSelect").value = item.leaveReason || "事假";
      } else if(key === "timeRange"){
        document.getElementById("fieldInputWrap").style.display = "none";
        document.getElementById("fieldTimeBox").style.display = "block";
        document.getElementById("fieldStartTimeLabel").innerText = "请假开始时间";
        document.getElementById("fieldEndTimeLabel").innerText = "请假结束时间";
        document.getElementById("fieldDurationLabel").innerText = "请假时长";
        document.getElementById("fieldStartTime").value = toDatetimeLocal(item.startTime);
        document.getElementById("fieldEndTime").value = toDatetimeLocal(item.endTime);
        document.getElementById("fieldDurationPreview").value = item.duration || "";
        document.getElementById("fieldTip").innerText = "修改时间后会自动重新计算请假时长";
      } else if(key === "detailTimeRange"){
        document.getElementById("fieldInputWrap").style.display = "none";
        document.getElementById("fieldTimeBox").style.display = "block";
        document.getElementById("fieldStartTimeLabel").innerText = "外出开始时间";
        document.getElementById("fieldEndTimeLabel").innerText = "外出结束时间";
        document.getElementById("fieldDurationLabel").innerText = "共计";
        document.getElementById("fieldStartTime").value = toDatetimeLocal(item.outStartTime);
        document.getElementById("fieldEndTime").value = toDatetimeLocal(item.outEndTime);
        document.getElementById("fieldDurationPreview").value = calcDurationText2(item.outStartTime, item.outEndTime);
        document.getElementById("fieldTip").innerText = "修改时间后会自动重新计算时长";
      } else {
        document.getElementById("fieldInput").value = item[key] || "";
      }

      document.getElementById("fieldMask").style.display = "flex";
    }

    function closeFieldSheet(){
      document.getElementById("fieldMask").style.display = "none";
    }

    function saveFieldSheet(){
      const data = getData();
      const item = data.find(x => x.id === currentField.id);
      if(!item) return;

      if(currentField.key === "isRenew" || currentField.key === "informedGuardian" || currentField.key === "isLeaveSchool" || currentField.key === "isLeaveDorm" || currentField.key === "withCompanion"){
        item[currentField.key] = document.getElementById("fieldSelect").value;
      } else if(currentField.key === "cancelStatus" || currentField.key === "leaveType" || currentField.key === "leaveReason"){
        item[currentField.key] = document.getElementById("fieldSelect").value;
      } else if(currentField.key === "timeRange"){
        item.startTime = fromDatetimeLocal(document.getElementById("fieldStartTime").value);
        item.endTime = fromDatetimeLocal(document.getElementById("fieldEndTime").value);
        const d = calcDurationText2(item.startTime, item.endTime);
        if(!d){
          showToast("时间区间无效");
          return;
        }
        item.duration = d;
      } else if(currentField.key === "detailTimeRange"){
        item.outStartTime = fromDatetimeLocal(document.getElementById("fieldStartTime").value);
        item.outEndTime = fromDatetimeLocal(document.getElementById("fieldEndTime").value);
        const d = calcDurationText2(item.outStartTime, item.outEndTime);
        if(!d){
          showToast("时间区间无效");
          return;
        }
      } else if(currentField.key === "reason"){
        item.reason = normalizeReasonText(document.getElementById("fieldInput").value.trim());
      } else {
        item[currentField.key] = document.getElementById("fieldInput").value.trim();
      }

      setData(data);
      closeFieldSheet();
      render();
      if(currentDetailId !== null) renderDetailPage(currentDetailId);
      showToast("已保存");
    }

    function deleteCurrentCard(){
      if(!requireUnlock()) return;
      if(currentField.source !== "list"){
        showToast("详情字段不可删除整条记录");
        return;
      }
      if(!confirm("确定删除这条请假记录吗？")) return;
      const data = getData().filter(x => x.id !== currentField.id);
      setData(data);
      closeFieldSheet();
      if(currentDetailId === currentField.id){
        closeDetailPage();
      }
      render();
      showToast("已删除");
    }

    function changeTag(id){
      if(!requireUnlock()) return;
      const data = getData();
      const item = data.find(x => x.id === id);
      if(!item) return;

      const arr = ["finished", "pending", "approving", "reject", ""];
      const idx = arr.indexOf(item.tagType || "");
      item.tagType = arr[(idx + 1) % arr.length];

      if(item.tagType === "finished" && !item.cancelStatus){
        item.cancelStatus = "已销假";
      }
      if(item.tagType === "pending" && !item.cancelStatus){
        item.cancelStatus = "待销假";
      }
      if(item.tagType === "approving"){
        item.cancelStatus = "";
      }

      setData(data);
      render();
      if(currentDetailId !== null) renderDetailPage(currentDetailId);
      showToast(item.tagType ? "状态已切换为" + tagText(item.tagType) : "已清除状态条");
    }

    function stopTicketCountdown(){
      if(ticketTimer){
        clearInterval(ticketTimer);
        ticketTimer = null;
      }
      ticketDeadline = 0;
    }

    function startTicketCountdown(){
      stopTicketCountdown();

      const bar = document.getElementById("ticketCountdown");
      const secondsEl = document.getElementById("ticketSeconds");

      bar.style.display = "flex";
      ticketDeadline = Date.now() + 60 * 1000;

      function updateCountdown(){
        const remaining = Math.max(
          0,
          Math.ceil((ticketDeadline - Date.now()) / 1000)
        );

        secondsEl.textContent = remaining;

        if(remaining <= 0){
          clearInterval(ticketTimer);
          ticketTimer = null;
        }
      }

      updateCountdown();
      ticketTimer = setInterval(updateCountdown, 250);
    }

    function openDetailPage(id, showCountdown=false){
      currentDetailId = id;
      setWechatTitle("日常请假详情");
      renderDetailPage(id);
      document.getElementById("detailPage").style.display = "block";

      const bar = document.getElementById("ticketCountdown");

      if(showCountdown){
        startTicketCountdown();
      }else{
        stopTicketCountdown();
        bar.style.display = "none";
      }
    }

    function closeDetailPage(){
      stopTicketCountdown();
      document.getElementById("ticketCountdown").style.display = "none";
      document.getElementById("detailPage").style.display = "none";
      currentDetailId = null;
      setWechatTitle("日常请假列表");
    }

        </div>
        <div class="detail-row">
          <div class="detail-label">监护人电话</div>
          <div class="detail-value ${canEdit ? 'editable' : ''}" onclick="openFieldEditor(${id}, 'guardianPhone', '监护人电话', 'detail')">${detailText(item.guardianPhone)}</div>
        </div>
      `;

      outBox.innerHTML = `
        <div class="detail-row">
          <div class="detail-label"><span class="required">*</span>是否离校</div>
          ${renderRadioRow(id, 'isLeaveSchool', item.isLeaveSchool)}
        </div>
        <div class="detail-row">
          <div class="detail-label"><span class="required">*</span>是否离开廊坊</div>
          ${renderRadioRow(id, 'isLeaveDorm', item.isLeaveDorm)}
        </div>
        <div class="detail-row">
          <div class="detail-label"><span class="required">*</span>外出地点</div>
          <div class="detail-value ${canEdit ? 'editable' : ''}" onclick="openFieldEditor(${id}, 'outPlace', '外出地点', 'detail')">${detailText(item.outPlace)}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">外出详细地点</div>
          <div class="detail-value ${canEdit ? 'editable' : ''}" onclick="openFieldEditor(${id}, 'outDetailPlace', '外出详细地点', 'detail')">${detailText(item.outDetailPlace)}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label"><span class="required">*</span>外出时间</div>
          <div class="detail-value ${canEdit ? 'editable' : ''}" onclick="openFieldEditor(${id}, 'detailTimeRange', '外出时间', 'detail')">${detailText(item.outStartTime + " 至 " + item.outEndTime)}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label"><span class="required">*</span>外出方式（去）</div>
          <div class="detail-value ${canEdit ? 'editable' : ''}" onclick="openFieldEditor(${id}, 'outWayGo', '外出方式（去）', 'detail')">${detailText(item.outWayGo)}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label"><span class="required">*</span>外出方式（回）</div>
          <div class="detail-value ${canEdit ? 'editable' : ''}" onclick="openFieldEditor(${id}, 'outWayBack', '外出方式（回）', 'detail')">${detailText(item.outWayBack)}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label"><span class="required">*</span>是否结伴同行</div>
          ${renderRadioRow(id, 'withCompanion', item.withCompanion)}
        </div>
      `;
    }

    function setRadioValue(id, key, value){
      if(!requireUnlock()) return;
      const data = getData();
      const item = data.find(x => x.id === id);
      if(!item) return;
      item[key] = value;
      setData(data);
      renderDetailPage(id);
      render();
      showToast("已保存");
    }

    function openAddSheet(){
      if(!requireUnlock()) return;
      clearAddForm(false);
      document.getElementById("addMask").style.display = "flex";
    }

    function closeAddSheet(){
      document.getElementById("addMask").style.display = "none";
    }

    function clearAddForm(showMsg=true){
      document.getElementById("aStudentId").value = "";
      document.getElementById("aStudentName").value = "";
      document.getElementById("aStartTime").value = "";
      document.getElementById("aEndTime").value = "";
      document.getElementById("aDuration").value = "";
      document.getElementById("aRenew").value = "否";
      document.getElementById("aReason").value = "";
      document.getElementById("aCancelStatus").value = "";
      document.getElementById("aTagType").value = "";
      if(showMsg) showToast("新增内容已清空");
    }

    function saveAddSheet(){
      const studentId = document.getElementById("aStudentId").value.trim();
      const studentName = document.getElementById("aStudentName").value.trim();
      const startTime = fromDatetimeLocal(document.getElementById("aStartTime").value);
      const endTime = fromDatetimeLocal(document.getElementById("aEndTime").value);
      const duration = document.getElementById("aDuration").value.trim();
      const isRenew = document.getElementById("aRenew").value;
      const reason = normalizeReasonText(document.getElementById("aReason").value.trim());
      const cancelStatus = document.getElementById("aCancelStatus").value;
      const tagType = document.getElementById("aTagType").value;

      if(!startTime || !endTime || !duration){
        showToast("请先选择有效的请假区间");
        return;
      }

      const data = getData();
      data.unshift(ensureDetailFields({
        id: Date.now(),
        studentId,
        studentName,
        startTime,
        endTime,
        duration,
        isRenew,
        reason,
        cancelStatus,
        tagType,

        term: "2025-2026学年第二学期",
        leaveType: "校外",
        leaveReason: "事假",
        detailDesc: "",
        mobilePhone: "",
        informedGuardian: "是",
        guardianName: "",
        guardianPhone: "",
        isLeaveSchool: "是",
        isLeaveDorm: "是",
        outPlace: "",
        outDetailPlace: "",
        outStartTime: startTime,
        outEndTime: endTime,
        outWayGo: "打车",
        outWayBack: "打车",
        withCompanion: "是"
      }));

      setData(data);
      closeAddSheet();
      render();
      showToast("新增成功");
    }

    function updateAddDuration(){
      const start = fromDatetimeLocal(document.getElementById("aStartTime").value);
      const end = fromDatetimeLocal(document.getElementById("aEndTime").value);
      document.getElementById("aDuration").value = calcDurationText2(start, end);
    }

    function updateFieldDuration(){
      const start = fromDatetimeLocal(document.getElementById("fieldStartTime").value);
      const end = fromDatetimeLocal(document.getElementById("fieldEndTime").value);
      document.getElementById("fieldDurationPreview").value = calcDurationText2(start, end);
    }

    function bindDetailSwipeBack(){
      const detailPage = document.getElementById("detailPage");

      detailPage.addEventListener("touchstart", function(e){
        if(currentDetailId === null) return;
        if(!e.touches || !e.touches.length) return;
        const t = e.touches[0];
        detailTouchStartX = t.clientX;
        detailTouchStartY = t.clientY;
        detailTouching = true;
      }, { passive:true });

      detailPage.addEventListener("touchmove", function(e){
        if(!detailTouching || currentDetailId === null) return;
        if(!e.touches || !e.touches.length) return;
      }, { passive:true });

      detailPage.addEventListener("touchend", function(e){
        if(!detailTouching || currentDetailId === null) return;
        if(!e.changedTouches || !e.changedTouches.length){
          detailTouching = false;
          return;
        }
        const t = e.changedTouches[0];
        const dx = t.clientX - detailTouchStartX;
        const dy = t.clientY - detailTouchStartY;

        detailTouching = false;

        if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.2){
          if(dx > 0){
            closeDetailPage();
          }
        }
      }, { passive:true });

      detailPage.addEventListener("touchcancel", function(){
        detailTouching = false;
      }, { passive:true });
    }

    document.getElementById("aStartTime").addEventListener("change", updateAddDuration);
    document.getElementById("aEndTime").addEventListener("change", updateAddDuration);
    document.getElementById("fieldStartTime").addEventListener("change", updateFieldDuration);
    document.getElementById("fieldEndTime").addEventListener("change", updateFieldDuration);

    document.getElementById("passwordMask").addEventListener("click", e => {
      if(e.target.id === "passwordMask") closePasswordSheet();
    });
    document.getElementById("fieldMask").addEventListener("click", e => {
      if(e.target.id === "fieldMask") closeFieldSheet();
    });
    document.getElementById("addMask").addEventListener("click", e => {
      if(e.target.id === "addMask") closeAddSheet();
    });

    document.addEventListener("keydown", function(e){
      if(e.key === "Escape" && currentDetailId !== null){
        closeDetailPage();
      }
    });

    setUnlocked(false);
    setWechatTitle("日常请假列表");
    render();
    bindSecretTrigger();
    bindDetailSwipeBack();
  </script>
</body>
</html>
